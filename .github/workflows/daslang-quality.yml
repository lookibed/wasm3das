name: Daslang quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daslang-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Daslang quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # The compiler is the daslang source pinned in scripts/daslang_pin,
      # checked out from upstream and built in place, exactly as a developer
      # machine would (see scripts/verify_daslang.sh and README, Install and run).
      DASLANG_ROOT: ${{ github.workspace }}/daslang-src
      DASLANG: ${{ github.workspace }}/daslang-src/bin/daslang
      DAS_LINT_CONFIG_PATH: ${{ github.workspace }}/.lint_config

    steps:
      - name: Check out wasm3das
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A change that touches none of the gate's inputs (docs, notes, README)
      # ends here with a green status, so a required check is satisfied
      # without building the toolchain. Every later step is conditional.
      - name: Decide whether the gate has anything to check
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base commit; running the full gate"
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "changed files:"
          printf '  %s\n' $changed
          if printf '%s\n' "$changed" | grep -Eq '^(source/|tests/integration/|tests/host_test/|app/|scripts/|\.githooks/|\.github/workflows/|\.lint_config$|PORTING_MANIFEST\.md$)'; then
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "no gate inputs changed; skipping the Daslang gate"
            echo "run_gate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the pinned daslang commit
        if: steps.changes.outputs.run_gate == 'true'
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^\([0-9a-f]\{40\}\)$/\1/p' scripts/daslang_pin | head -n 1)"
          echo "commit=$pin" >> "$GITHUB_OUTPUT"

      - name: Cache the built daslang checkout
        if: steps.changes.outputs.run_gate == 'true'
        id: cache-daslang
        uses: actions/cache@v4
        with:
          path: daslang-src
          key: daslang-master-${{ steps.pin.outputs.commit }}-${{ runner.os }}-${{ runner.arch }}-gcc

      - name: Build the pinned daslang from upstream source
        if: steps.changes.outputs.run_gate == 'true' && steps.cache-daslang.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone https://github.com/GaijinEntertainment/daScript.git daslang-src
          git -C daslang-src checkout "${{ steps.pin.outputs.commit }}"
          cmake -S daslang-src -B daslang-src/build -DCMAKE_BUILD_TYPE=Release \
                -DDAS_LLVM_DISABLED=ON -DDAS_GLFW_DISABLED=ON -DDAS_IMGUI_DISABLED=ON \
                -DDAS_VULKAN_DISABLED=ON -DDAS_AUDIO_DISABLED=ON -DDAS_HV_DISABLED=ON \
                -DDAS_STDDLG_DISABLED=ON -DDAS_STBIMAGE_DISABLED=ON \
                -DDAS_AOT_EXAMPLES_DISABLED=ON -DDAS_TUTORIAL_DISABLED=ON \
                -DDAS_TESTS_DISABLED=ON -DDAS_TREE_SITTER_DISABLED=ON
          cmake --build daslang-src/build -j 8 --target \
                daslang libDaScript libDaScript_runtime libUriParser

      - name: Verify pinned compiler
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/verify_daslang.sh

      # The gate itself is defined once in scripts/gate.sh and shared with the
      # pre-push hook; the steps below only split it for readable CI output.
      - name: Compiler diagnostics
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh compile

      - name: Paranoid lint
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh lint-paranoid

      - name: Performance lint
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh lint-perf

      - name: Style lint
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh lint-style

      - name: Project tests
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh test

      - name: Repository invariants
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh invariants
