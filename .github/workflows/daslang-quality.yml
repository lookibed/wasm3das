name: Daslang quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daslang-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Daslang quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # The compiler is the daslang release bundle pinned in
      # scripts/daslang_release.env, installed by scripts/install_daslang.sh
      # into tmp/daslang, exactly as on a developer machine.
      DASLANG_ROOT: ${{ github.workspace }}/tmp/daslang
      DASLANG: ${{ github.workspace }}/tmp/daslang/bin/daslang
      DAS_LINT_CONFIG_PATH: ${{ github.workspace }}/.lint_config

    steps:
      - name: Check out wasm3das
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A change that touches none of the gate's inputs (docs, notes, README)
      # ends here with a green status, so a required check is satisfied
      # without building the toolchain. Every later step is conditional.
      - name: Decide whether the gate has anything to check
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base commit; running the full gate"
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "changed files:"
          printf '  %s\n' $changed
          if printf '%s\n' "$changed" | grep -Eq '^(source/|tests/integration/|tests/host_test/|app/|scripts/|\.githooks/|\.github/workflows/|\.lint_config$|PORTING_MANIFEST\.md$)'; then
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "no gate inputs changed; skipping the Daslang gate"
            echo "run_gate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the pinned daslang release
        if: steps.changes.outputs.run_gate == 'true'
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          source scripts/daslang_release.env
          echo "release=$DASLANG_RELEASE" >> "$GITHUB_OUTPUT"
          echo "sha256=$DASLANG_SHA256_linux_x86_64" >> "$GITHUB_OUTPUT"

      - name: Cache the daslang release bundle
        if: steps.changes.outputs.run_gate == 'true'
        id: cache-daslang
        uses: actions/cache@v4
        with:
          path: tmp/daslang
          key: daslang-release-linux-x86_64-${{ steps.pin.outputs.release }}-${{ steps.pin.outputs.sha256 }}

      - name: Install the pinned daslang release
        if: steps.changes.outputs.run_gate == 'true' && steps.cache-daslang.outputs.cache-hit != 'true'
        run: scripts/install_daslang.sh linux-x86_64

      - name: Verify pinned compiler
        if: steps.changes.outputs.run_gate == 'true'
        run: |
          cat "$DASLANG_ROOT/.wasm3das-release"
          "$DASLANG" --version

      # The gate itself is defined once in scripts/gate.sh and shared with the
      # pre-push hook; the steps below only split it for readable CI output.
      - name: Compiler diagnostics
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh compile

      - name: Paranoid lint
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh lint-paranoid

      - name: Performance lint
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh lint-perf

      - name: Style lint
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh lint-style

      - name: Project tests
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh test

      - name: Repository invariants
        if: steps.changes.outputs.run_gate == 'true'
        run: scripts/gate.sh invariants
